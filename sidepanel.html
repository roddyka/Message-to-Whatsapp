          <span class="phone__prefix" id="prefix">+55</span>
          <input id="number" type="tel" inputmode="numeric" autocomplete="off"
            data-i18n-placeholder="numberPlaceholder"
            placeholder="DDD + número (ex.: 11 91234-5678)">
        </div>
        <p class="field__error" id="numberError" data-i18n="numberError" hidden>Informe o número com DDD.</p>
      </div>

      <div class="field">
        <div class="field__row">
          <label class="field__label" for="message"><span data-i18n="message">Mensagem</span> <span class="field__optional" data-i18n="optional">(opcional)</span></label>
          <span class="field__counter" id="counter">0</span>
        </div>
        <textarea id="message" rows="5" data-i18n-placeholder="messagePlaceholder" placeholder="Escreva sua mensagem…"></textarea>
      </div>

      <label class="switch">
        <input type="checkbox" id="newTab">
        <span class="switch__track"><span class="switch__thumb"></span></span>
        <span class="switch__label" data-i18n="newTab">Abrir em nova aba</span>
      </label>

      <div class="actions">
        <button type="button" class="btn btn--ghost" id="clear" data-i18n="clear">Limpar</button>
        <button type="submit" class="btn btn--primary" id="send">

            <path fill="currentColor" d="M2.01 21 23 12 2.01 3 2 10l15 2-15 2z" />
          </svg>
          <span data-i18n="send">Enviar no WhatsApp</span>
        </button>
      </div>
